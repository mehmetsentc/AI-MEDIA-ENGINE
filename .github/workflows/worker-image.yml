name: worker-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/worker/Dockerfile
      - deploy/worker/worker_ready.py
      - src/media_engine/engines/image/qwen_remote.py
      - src/media_engine/engines/image/model_cache.py
      - src/media_engine/engines/image/r2_cache.py
      - .github/workflows/worker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/ai-media-engine-worker:sha-${{ github.sha }}

      - name: Record digest
        run: echo "pinned=ghcr.io/${{ github.repository_owner }}/ai-media-engine-worker@${{ steps.push.outputs.digest }}"
