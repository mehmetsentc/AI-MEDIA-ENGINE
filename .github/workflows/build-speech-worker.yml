name: build-speech-worker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push speech image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker/speech/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/ai-media-engine-speech-worker:sha-${{ github.sha }}

      - name: Verify pins, digest, and absent weights
        run: |
          set -eu
          digest="${{ steps.push.outputs.digest }}"
          case "$digest" in
            sha256:*) ;;
            *) echo "image digest is not immutable" >&2; exit 1 ;;
          esac
          image="ghcr.io/${{ github.repository_owner }}/ai-media-engine-speech-worker@${digest}"
          case "$image" in
            *"/ai-media-engine-worker@"*|*"ai-media-engine-worker:"*)
              echo "refusing the Qwen image name" >&2
              exit 1
              ;;
          esac
          docker pull "$image"
          docker run --rm --entrypoint python3 "$image" /workspace/speech_probe.py > /tmp/speech-probe.json
          python3 - << 'PY'
          import json
          payload = json.load(open("/tmp/speech-probe.json", encoding="utf-8"))
          expected = {
              "faster_whisper": "1.2.1",
              "ctranslate2": "4.8.2",
              "qwen_tts": "0.1.1",
              "transformers": "4.57.3",
              "accelerate": "1.12.0",
              "torchaudio": "2.11.0",
          }
          for name, version in expected.items():
              if payload.get(name) != version:
                  raise SystemExit("version mismatch")
          if not str(payload.get("torch", "")).startswith("2.11."):
              raise SystemExit("torch mismatch")
          if payload.get("cuda_gpu_support") is not False:
              raise SystemExit("cuda must stay unclaimed")
          if payload.get("imports_ok") is not True:
              raise SystemExit("imports failed")
          print("speech_probe_ok")
          PY
          docker run --rm --entrypoint bash "$image" -lc 'test ! -e /models/speech/model.bin && test ! -e /models/speech/model.safetensors && test ! -e /workspace/model.bin && test ! -e /workspace/model.safetensors'

      - name: Write image reference artifact
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          python3 - << 'PY'
          import json, os
          digest = os.environ["IMAGE_DIGEST"]
          sha = os.environ["GITHUB_SHA"]
          owner = os.environ["OWNER"].lower()
          repository = f"ghcr.io/{owner}/ai-media-engine-speech-worker"
          if repository.endswith("/ai-media-engine-worker"):
              raise SystemExit("qwen image name")
          if not digest.startswith("sha256:") or len(digest) != 71:
              raise SystemExit("digest")
          document = {
              "repository": repository,
              "tag": f"sha-{sha}",
              "digest": digest,
              "pinned_reference": f"{repository}@{digest}",
              "previous_digest": "",
              "cuda_gpu_support": False,
          }
          path = "deploy/worker/speech/image_ref.json"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(document, handle, indent=2)
              handle.write("\n")
          print(document["pinned_reference"])
          PY

      - name: Upload image reference
        uses: actions/upload-artifact@v4
        with:
          name: speech-image-ref
          path: deploy/worker/speech/image_ref.json
